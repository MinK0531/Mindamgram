<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<div th:fragment="createPopup">

    <div id="popup-overlay" class="create-popup">
        <div id="popup" class="popup">

            <div class="popup-header d-flex align-items-center">
                <div class="col-1 d-flex justify-content-start align-items-center create-color pr-2">
                    <button class="btn btn-link p-0 close-btn position-absolute pl-2" id="cancelBtn">
                        <i class="bi bi-x-square close-icon"></i>
                    </button>
                </div>

                <div class="col-6 d-flex justify-content-center line create-color">
                    <h5 class="mr-5 font-weight-bold">새 게시물 만들기</h5>
                </div>

                <div class="col-5 d-flex justify-content-between align-items-center">
                    <div>
                        <img src="/img/profileb-icon.png" class="popup-profile-icon">
                        <span th:text="${session.userName}"
                              class="popup-profile m-0 font-weight-bold mr-3"></span>
                    </div>
                    <div class="p-2">
                        <button class="popup-btn" id="uploadBtn">업로드</button>
                    </div>
                </div>
            </div>
            <div id="popupBody" class="popup-contents d-flex">
                <div class="col-7 create-color line d-flex justify-content-center align-items-center flex-column">
                    <input type="file" id="image-input" class="d-none">
                    <div id="initial-upload-prompt" class="text-center">
                        <div class="bg-img text-center">
                            <i class="bi bi-image image-upload"></i>
                            <p class="mt-3"></p>
                        </div>
                        <img id="image-preview" class="d-none mt-2"/>
                        <button type="button" class="btn mt-2 upload-btn" id="selectImageBtn">
                            컴퓨터에서 선택
                        </button>

                    </div>
                </div>
                <div class="col-5 ">
                    <div>
                        <textarea class="form-control mt-2" rows="12" placeholder="내용을 입력하세요" id="contentsInput"></textarea>

                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script th:inline="javascript">

        $("#image-input").on("change", function (e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith("image/")) {
                alert("이미지 파일만 선택 가능합니다.");
                $(this).val("");
                return;
            }

            const reader = new FileReader();

            reader.onload = function (event) {
                $("#image-preview")
                    .attr("src", event.target.result)
                    .removeClass("d-none");

                $(".bg-img").addClass("d-none");
            };

            reader.readAsDataURL(file);
        });

        $("#selectImageBtn").on("click", function () {
            $("#image-input").click();
        });
        $("#uploadBtn").on("click",function (){
            let contents = $("#contentsInput").val();
            let file = $("#image-input")[0].files[0];
            if (contents == ""){
                alert("내용을 입력하세요");
                return;
            }
            let formData = new FormData();
            formData.append("contents",contents);
            formData.append("imageFile",file);

            $.ajax({
                type:"post"
                , url:"/post/write-process"
                , data:formData
                , processData: false
                , contentType: false
                , success: function (response){
                    if (response.result == "success"){
                        location.href="/post/home";
                    }else {
                        alert("작성 실패!")
                    }
                }
                , error:function (){
                    alert("작성 에러!")
                }
            });

        });



        $(document).ready(function () {
            const popupOverlay = $('#popup-overlay');
            const createPostLink = $('#create-post-link');
            const cancelBtn = $('#cancelBtn');

            function closePopup() {
                popupOverlay.fadeOut(200);
            }

            function openPopup(e) {
                e.preventDefault();
                popupOverlay.css('display', 'flex').hide().fadeIn(200);
            }

            createPostLink.on('click', openPopup);
            cancelBtn.on('click', closePopup);

            popupOverlay.on('click', function (e) {
                if (e.target.id === 'popup-overlay') {
                    closePopup();
                }
            });
        });
    </script>

</div>
</html>
