<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/home.css">
</head>
<body>
    <div id="wrap">
        <header class="d-flex justify-content-start align-items-center ml-5">
            <img src="/img/logoW2.png" alt="로고">
        </header>
        <div class="home ">
            <aside class="sidebar">
                <nav class="main-menu justify-content-start mt-4 mb-5">
                    <ul class="nav flex-column font-weight-bold ml-4 mt-2">
                        <li class="nav-item"><a href="#" class="ml-1 nav-link black"><img src="/img/home-icon.png" alt="홈" class="ml-1 menu-icon">홈</a></li>
                        <li class="nav-item"><a href="#" class="nav-link black"><img src="/img/search-icon.png" alt="검색" class="menu-icon">검색</a></li>
                        <li class="nav-item"><a href="#" class="nav-link black"><img src="/img/message-icon.png" alt="메시지" class="menu-icon">메시지</a></li>
                        <li class="nav-item"><a href="#" class="nav-link black"><img src="/img/favorite-icon.png" alt="알림" class="menu-icon">알림</a></li>
                        <li class="nav-item"><a href="#" class="ml-1 nav-link black"><img src="/img/create-icon.png" alt="만들기" class="ml-1 menu-icon">만들기</a></li>
                    </ul>
                    <div>
                        <a href="#" class="user-profile ml-1 nav-link black">
                        <img src="/img/profileb-icon.png" alt="name" class=" ml-4 menu-icon">
                        <span th:text="${session.userName}" class="font-weight-bold"></span></a>
                    </div>
                    <div th:if="${session.userId != null}" class="flex-column mt-2">
                        <a href="/user/signout" class=" ml-1 logout black">로그아웃</a>
                    </div>
                </nav>
            </aside>

            <div class="social d-flex justify-content-center align-items-center flex-column">
                <div class="posting">
                    <div class="post-header d-flex">
                        <div class="col-2 p-2 d-flex justify-content-center align-items-center">
                            <img src="/img/profilew-icon.png" alt="name" class="mt-2 ml-4 menu-icon mb-2">
                        </div>
                        <div class="col-10  d-flex flex-column justify-content-start align-items-start">
                            <span th:text="${session.userName}" class="white font-weight-bold"></span>
                            <span class="white text-small mb-2">Time</span>
                        </div>
                    </div>
                    <div class="img-box">


                    </div>
                    <div class="icon-box  d-flex">
                        <div class="d-flex justify-content-start align-items-center col-10">
                            <button class="btn btn-link">
                                <img src="/img/favoritefill-icon.png" alt="favoritefill" class="btnSize">
                            </button>
                            <button class="btn btn-link">
                                <img src="/img/talk-icon.png" alt="talk">
                            </button>
                            <button class="btn btn-link">
                                <img src="/img/share-icon.png" alt="share">
                            </button>
                            <button class="btn btn-link">
                                <img src="/img/send-icon.png" alt="send">
                            </button>
                        </div>
                        <div class="bg-info col-2">
                            <button class="btn btn-link">
                                <img src="/img/save-icon.png" alt="save">
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
