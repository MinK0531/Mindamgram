<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <title>home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/default_w.css">
    <link rel="stylesheet" href="/css/create.css">
    <link rel="stylesheet" href="/css/posting.css">
    <link rel="stylesheet" href="/css/profile.css">


</head>

<body>
<div id="wrap">
    <header class="d-flex justify-content-start align-items-center ml-5">
        <img src="/img/logoW2.png" alt="로고">
    </header>

    <div class="home">
        <aside class="sidebar">
            <nav class="main-menu justify-content-start mt-4 mb-5">
                <ul class="nav flex-column font-weight-bold ml-4 mt-2">
                    <li class="nav-item"><a href="/post/home" class="ml-1 nav-link black"><img src="/img/home-icon.png" class="menu-icon">홈</a></li>
                    <li class="nav-item"><a href="#" class="nav-link black"><img src="/img/search-icon.png" class="menu-icon">검색</a></li>
                    <li class="nav-item"><a href="#" class="nav-link black"><img src="/img/message-icon.png" class="menu-icon">메시지</a></li>
                    <li class="nav-item"><a href="#" class="nav-link black"><img src="/img/favorite-icon.png" class="menu-icon">알림</a></li>
                    <li class="nav-item"><a href="/post/create" id="create-post-link" class="ml-1 nav-link black"><img src="/img/create-icon.png" class="menu-icon">만들기</a></li>
                </ul>

                <div>
                    <a href="/post/profile" class="user-profile ml-1 nav-link black">
                        <img src="/img/profileb-icon.png" class="menu-icon">
                        <span th:text="${session.userName}" class="font-weight-bold"></span>
                    </a>
                </div>

                <div th:if="${session.userId != null}" class="flex-column mt-2">
                    <a href="/user/signout" class="ml-1 logout black">로그아웃</a>
                </div>
            </nav>
        </aside>

        <th:block layout:fragment="contents"></th:block>

    </div>
</div>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<th:block th:replace="post/create :: createPopup"></th:block>
<th:block layout:fragment="script"></th:block>

</body>
</html>
