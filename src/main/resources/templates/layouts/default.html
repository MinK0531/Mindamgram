<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <title>home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/create.css">
</head>

<body>
<div id="wrap">
    <header class="d-flex justify-content-start align-items-center ml-5">
        <img src="/img/logoW2.png" alt="로고">
    </header>

    <div class="home">
        <aside class="sidebar">
            <nav class="main-menu justify-content-start mt-4 mb-5">
                <ul class="nav flex-column font-weight-bold ml-4 mt-2">
                    <li class="nav-item"><a href="/post/home" class="ml-1 nav-link black"><img src="/img/home-icon.png" class="menu-icon">홈</a></li>
                    <li class="nav-item"><a href="#" class="nav-link black"><img src="/img/search-icon.png" class="menu-icon">검색</a></li>
                    <li class="nav-item"><a href="#" class="nav-link black"><img src="/img/message-icon.png" class="menu-icon">메시지</a></li>
                    <li class="nav-item"><a href="#" class="nav-link black"><img src="/img/favorite-icon.png" class="menu-icon">알림</a></li>
                    <li class="nav-item"><a href="/post/create" id="create-post-link" class="ml-1 nav-link black"><img src="/img/create-icon.png" class="menu-icon">만들기</a></li>                </ul>

                <div>
                    <a href="#" class="user-profile ml-1 nav-link black">
                        <img src="/img/profileb-icon.png" class="menu-icon">
                        <span th:text="${session.userName}" class="font-weight-bold"></span>
                    </a>
                </div>

                <div th:if="${session.userId != null}" class="flex-column mt-2">
                    <a href="/user/signout" class="ml-1 logout black">로그아웃</a>
                </div>
            </nav>
        </aside>

        <th:block layout:fragment="contents"></th:block>

    </div>
</div>

<div id="popup-overlay" class="create-popup"  >
    <div id="popup" class="popup">

        <div class="popup-header d-flex align-items-center ">
            <div class="col-1 d-flex justify-content-start align-items-center create-color pr-2">
                <button class="btn btn-link p-0 close-btn position-absolute pl-2" id="cancelBtn">
                    <i class="bi bi-x-square close-icon"></i>
                </button>
            </div>
            <div class="col-6 d-flex justify-content-center line create-color">
                <h5 class="mr-5 font-weight-bold">새 게시물 만들기</h5>
            </div>

            <div class="col-5 d-flex justify-content-between align-items-center">
                <div>
                    <img src="/img/profileb-icon.png" class="popup-profile-icon">
                    <span th:text="${session.userName}" class="popup-profile m-0 font-weight-bold mr-3"></span>
                </div>
                <div class="p-2">
                    <button class="popup-btn" id="uploadBtn" disabled>업로드</button>
                </div>
            </div>
        </div>
    </div>
    <div id="popupBody" class="popup-contents"></div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script th:inline="javascript">
    $(document).ready(function() {
        const popupOverlay = $('#popup-overlay');
        const createPostLink = $('#create-post-link');
        const cancelBtn = $('#cancelBtn');

        function closePopup() {
            popupOverlay.fadeOut(200);
        }

        function openPopup(e) {
            e.preventDefault();
            popupOverlay.css('display', 'flex').hide().fadeIn(200);
        }

        createPostLink.on('click', openPopup);

        cancelBtn.on('click', function() {
            closePopup();
        });


        popupOverlay.on('click', function(e) {
            if (e.target.id === 'popup-overlay') {
                closePopup();
            }
        });

    });
</script>
<th:block layout:fragment="script"></th:block>

</body>
</html>
