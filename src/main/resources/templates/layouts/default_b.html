<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <title>home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/default_b.css">
    <link rel="stylesheet" href="/css/create.css">
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/timeline.css">

</head>

<body>
<div id="wrap" class="d-flex">
    <div>
        <header class="d-flex justify-content-start align-items-center ml-5">
            <img src="/img/logo-shadow.png" alt="로고" class="logo-fixed-pos">
        </header>
        <div>
            <aside class="sidebar">
                <nav class="main-menu justify-content-start mt-4 mb-5">
                    <ul class="nav flex-column font-weight-bold ml-4 mt-2">
                        <li class="nav-item"><a href="/post/home" class="ml-1 nav-link white"><img src="/img/home-w-icon.png" class="menu-icon">홈</a></li>
                        <li class="nav-item"><a href="#" class="nav-link white"><img src="/img/search-w-icon.png" class="menu-icon">검색</a></li>
                        <li class="nav-item"><a href="#" class="nav-link white"><img src="/img/message-w-icon.png" class="menu-icon">메시지</a></li>
                        <li class="nav-item"><a href="#" class="nav-link white"><img src="/img/favorite-w-icon.png" class="menu-icon">알림</a></li>
                        <li class="nav-item"><a href="/post/create" id="create-post-link" class="ml-1 nav-link white"><img src="/img/create-w-icon.png" class="menu-icon">만들기</a></li>                </ul>

                    <div>
                        <a href="/post/profile" class="user-profile ml-1 nav-link white">
                            <img src="/img/profile-w-icon.png" class="menu-icon">
                            <span th:text="${session.userSigninId}" class="font-weight-bold"></span>
                        </a>
                    </div>

                    <div th:if="${session.userId != null}" class="flex-column mt-2">
                        <a href="/user/signout" class="ml-1 logout white">로그아웃</a>
                    </div>
                </nav>
            </aside>
        </div>
    </div>
    <div class="profile">
        <main class="profile-content">
            <th:block layout:fragment="profile"></th:block>
        </main>
    </div>
</div>

<th:block th:replace="post/post_detail_popup :: postDetailPopup"></th:block>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<th:block th:replace="post/create :: createPopup"></th:block>

<th:block th:replace="post/create :: createPopupScript"></th:block>

<th:block layout:fragment="script"></th:block>

</body>
</html>
